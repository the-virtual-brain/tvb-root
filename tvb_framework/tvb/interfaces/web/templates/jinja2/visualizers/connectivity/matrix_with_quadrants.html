{% macro draw2DConnectivityMatrix(hemisphereId, startHemisphereIdx, endHemisphereIdx, startHemisphereIdy, endHemisphereIdy, prefix) -%}
  <div id="{{ hemisphereId }}" class="matrix-quadrant">
    <!--! The matrix is drawn on a single canvas instead of an N*N HTML table, so it scales to large connectivities. -->
    <canvas class="matrix-canvas" id="canvas_{{ hemisphereId }}"
            data-prefix="{{ prefix }}"
            data-col-start="{{ startHemisphereIdx }}" data-col-end="{{ endHemisphereIdx }}"
            data-row-start="{{ startHemisphereIdy }}" data-row-end="{{ endHemisphereIdy }}"></canvas>
  </div>
{%- endmacro %}
