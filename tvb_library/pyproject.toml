[build-system]
# scikit-build-core drives the whole tvb-library build: it collects the pure
# Python `tvb` package tree (replacing hatchling) AND compiles the nanobind
# C++ hybrid simulator extension (tvb/simulator/backend/cpp_hybrid/_core.cpp)
# so a single `pip install tvb-library` — editable or from a wheel — delivers
# the compiled backend.
# numpy, scipy, numba and six are build requirements too, not just runtime
# ones: CMake runs dfungen during the build (see CMakeLists.txt) to emit the
# expression-driven dfun kernels of the supported model set, and dfungen
# emits them by importing the modules of those models and instantiating each
# class — so real imports are unavoidable and must exist before the package's
# own dependencies are installed.  Discovery is scoped with --only-supported
# to the 27 models the hybrid backends support (nb_hybrid.
# _get_supported_models_classes): 25 of them are expression-driven and their
# modules are exactly the numba-dfun modules; modules outside that set are
# neither imported nor emitted.  Minimal verified set (each one makes
# dfungen --strict fail with a ModuleNotFoundError naming it when omitted):
#   numpy  - dfungen itself + every model module
#   six    - tvb.basic.neotraits._core (`from six import add_metaclass`)
#   scipy  - neotraits NArray (csc_matrix), stefanescu_jirsa, cerebellar_mf
#   numba  - the numba-dfun model modules (epileptor*, jansen_rit, oscillator,
#            wilson_cowan, wong_wang*, k_ion_exchange, zerlaut); without it
#            those models are simply absent from the generated table
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=1.3.2",
  "numpy",
  "scipy",
  "numba",
  "six",
]
build-backend = "scikit_build_core.build"

[project]
name = "tvb-library"
version = "2.11.0"
description = "A package for performing whole brain simulations"
readme = "README.rst"
license = { file = "LICENSE" }
# Pure-Python parts of tvb-library keep this Python floor; the compiled
# cpp_hybrid backend needs >= 3.12 (cp312 stable-ABI wheels) - see the
# support matrix in tvb/simulator/backend/cpp_hybrid/README.md.
requires-python = ">=3.8"
authors = [
    { name = "Marmaduke Woodman" },
    { name = "Jan Fousek" },
    { name = "Stuart Knock" },
    { name = "Paula Sanz Leon" },
    { name = "Viktor Jirsa" },
]
maintainers = [
    { name = "TVB Admin", email = "tvb.admin@thevirtualbrain.org" }
]
keywords = [
    "animal",
    "brain",
    "delay",
    "dynamics",
    "human",
    "models",
    "neuronal",
    "neuroscience",
    "simulator",
    "tvb",
]
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    # The compiled cpp_hybrid backend ships cp312-abi3 stable-ABI wheels, so
    # 3.12 (and 3.13+, via the stable ABI) are the versions its wheels serve.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "autopep8",
    "Deprecated",
    "docutils",
    "ipywidgets",
    "mako>=1.1.4",
    "matplotlib",
    "networkx",
    "numba",
    "numexpr",
    "numpy",
    "scipy",
    "six",
]

[project.optional-dependencies]
test = [
    "h5py",
    "pytest",
    "pytest-benchmark",
    "pytest-xdist",
    "tvb-data",
    "tvb-gdist",
]

[project.urls]
Download = "https://github.com/the-virtual-brain/tvb-root"
Homepage = "https://www.thevirtualbrain.org"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"
# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel]
# Pure-Python package tree collected into the wheel (hatchling's
# `packages = ["tvb"]` equivalent); the compiled extension is added by the
# CMake `install(TARGETS _cpp_hybrid ...)` rule.
packages = ["tvb"]
# The compiled cpp_hybrid extension targets the CPython 3.12 stable ABI
# (nanobind stable ABI): one cp312-abi3 wheel serves CPython >= 3.12
# (3.12/3.13/3.14+; it cannot load on <3.12). Decision not to widen to
# cp310/cp311 is recorded in the cpp_hybrid README ("Support matrix & wheel
# policy") and the CI workflow comments (handoff item 7).
py-api = "cp312"

# In-place editable install: the extension is compiled straight into the
# source tree (`tvb/simulator/backend/cpp_hybrid/_cpp_hybrid.abi3.so`), which
# is how this repo is developed (PYTHONPATH=tvb_library). `rebuild = true`
# re-runs `cmake --build` on first import when _core.cpp changes.
[tool.scikit-build.editable]
mode = "inplace"
rebuild = true
